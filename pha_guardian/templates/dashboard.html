<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHA Guardian</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f5f5f5;
            color: #333;
        }
        h1 { color: #1a1a2e; }
        h2 { color: #1a1a2e; font-size: 1.1em; margin-top: 32px; }
        #summary {
            background: white;
            border-radius: 8px;
            padding: 16px 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
            font-size: 1.1em;
        }
        .issue {
            background: white;
            border-left: 5px solid #ccc;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .issue.high  { border-left-color: #e74c3c; }
        .issue.medium { border-left-color: #f39c12; }
        .issue.low   { border-left-color: #3498db; }
        .issue.unknown { border-left-color: #95a5a6; }
        .issue-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        .issue-title { font-weight: bold; margin-bottom: 6px; }
        .issue-detail { font-size: 0.9em; color: #666; }
        .issue-severity {
            font-size: 0.75em;
            text-transform: uppercase;
            font-weight: bold;
            color: #999;
            margin-top: 4px;
        }
        .issue-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .dismiss-btn {
            background: none;
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.85em;
            color: #999;
            white-space: nowrap;
        }
        .dismiss-btn:hover { background: #f0f0f0; }
        .fix-btn {
            background: none;
            border: 1px solid #3498db;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 0.85em;
            color: #3498db;
            white-space: nowrap;
        }
        .fix-btn:hover { background: #eaf4fb; }
        .fix-section {
            display: none;
            margin-top: 12px;
            padding: 12px;
            background: #f0f7ff;
            border-radius: 6px;
            font-size: 0.9em;
            color: #2c3e50;
            border-left: 3px solid #3498db;
        }
        .fix-section.visible { display: block; }
        .fix-label {
            font-weight: bold;
            margin-bottom: 4px;
            color: #2980b9;
        }
        #no-issues {
            background: white;
            border-radius: 8px;
            padding: 24px;
            text-align: center;
            color: #27ae60;
            font-size: 1.1em;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .scanner-section {
            background: white;
            border-radius: 8px;
            padding: 16px 24px;
            margin-top: 32px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.1);
        }
        .scanner-section h2 {
            margin-top: 0;
        }
        .automation-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            gap: 12px;
        }
        .automation-item:last-of-type {
            border-bottom: none;
        }
        .automation-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .automation-info {
            flex: 1;
        }
        .automation-name {
            font-weight: bold;
            font-size: 0.95em;
        }
        .automation-meta {
            font-size: 0.8em;
            color: #999;
            margin-top: 2px;
        }
        .save-btn {
            background: #2980b9;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 20px;
            cursor: pointer;
            font-size: 0.9em;
            margin-top: 16px;
        }
        .save-btn:hover { background: #2471a3; }
        .save-confirmation {
            display: none;
            color: #27ae60;
            font-size: 0.9em;
            margin-top: 8px;
        }
        .no-candidates {
            color: #999;
            font-size: 0.9em;
            padding: 8px 0;
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin: -12px 0 24px;
            font-size: 0.85em;
            color: #777;
        }
        .status-bar .save-btn { margin-top: 0; padding: 6px 16px; }
        .save-btn:disabled { background: #8aa9bf; cursor: wait; }
        #summary.attention { border-left: 5px solid #f39c12; }
        #summary.incomplete { border-left: 5px solid #95a5a6; }
        #summary.error { border-left: 5px solid #e74c3c; }
        #summary .summary-sub { font-size: 0.8em; color: #666; margin-top: 6px; }
        .incomplete-note {
            background: #f2f3f4;
            border-left: 5px solid #95a5a6;
            border-radius: 8px;
            padding: 14px 20px;
            margin-bottom: 16px;
            font-size: 0.9em;
        }
        .incomplete-note ul { margin: 8px 0 0; padding-left: 20px; color: #666; }
        .sharing-section p { font-size: 0.9em; color: #555; margin: 4px 0; }
        .sharing-state { font-weight: bold; }
        .dev-toolbar {
            background: #fff8db;
            border: 1px solid #ead78f;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }
        .dev-toolbar label {
            display: block;
            font-size: 0.78em;
            font-weight: bold;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: #74601e;
            margin-bottom: 6px;
        }
        .dev-toolbar select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #c9b867;
            border-radius: 5px;
            background: white;
        }
        .dev-description {
            color: #74601e;
            font-size: 0.85em;
            margin-top: 7px;
        }
    </style>
</head>
<body>
    <h1>🛡️ PHA Guardian</h1>
    {% if dev_mode %}
    <div class="dev-toolbar">
        <label for="scenario-select">Development scenario</label>
        <select id="scenario-select" onchange="selectScenario(this.value)"></select>
        <div class="dev-description" id="scenario-description"></div>
    </div>
    {% endif %}
    <div id="summary">Loading...</div>
    <div class="status-bar">
        <span id="last-checked"></span>
        <button class="save-btn" id="check-now" onclick="checkNow()">Check now</button>
    </div>
    <div id="incomplete-note"></div>
    <div id="issues-list"></div>

    <div class="scanner-section">
        <h2>🔍 Monitored Automations</h2>
        <p style="font-size:0.9em; color:#666;">Select which automations Guardian should watch for missed executions.</p>
        <div id="automation-list">Loading...</div>
        <button class="save-btn" onclick="saveSelections()">Save</button>
        <div class="save-confirmation" id="save-confirmation">✅ Saved!</div>
    </div>

    <div class="scanner-section sharing-section">
        <h2>🌐 Website sharing</h2>
        <p class="sharing-state" id="sharing-state">Checking…</p>
        <p id="sharing-detail"></p>
    </div>

    <script>
        const BASE_PATH = "{{ ingress_path }}";
        const dismissed = new Set();
        let candidates = [];
        let monitored = new Set();

        async function loadScenarios() {
            const select = document.getElementById('scenario-select');
            if (!select) return;
            const res = await fetch(BASE_PATH + '/dev/scenarios');
            const data = await res.json();
            select.innerHTML = '';
            data.scenarios.forEach(scenario => {
                const option = document.createElement('option');
                option.value = scenario.id;
                option.textContent = scenario.label;
                option.selected = scenario.id === data.current;
                option.dataset.description = scenario.description;
                select.appendChild(option);
            });
            updateScenarioDescription();
        }

        function updateScenarioDescription() {
            const select = document.getElementById('scenario-select');
            const description = document.getElementById('scenario-description');
            if (!select || !description) return;
            description.textContent = select.selectedOptions[0]?.dataset.description || '';
        }

        async function selectScenario(scenarioId) {
            await fetch(BASE_PATH + `/dev/scenarios/${scenarioId}`, { method: 'POST' });
            updateScenarioDescription();
            await Promise.all([loadIssues(), loadAutomations()]);
        }

        function esc(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function timeAgo(iso) {
            const seconds = Math.max(0, Math.round((Date.now() - new Date(iso)) / 1000));
            if (seconds < 60) return 'just now';
            const minutes = Math.round(seconds / 60);
            if (minutes < 60) return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
            const hours = Math.round(minutes / 60);
            if (hours < 24) return `${hours} hour${hours === 1 ? '' : 's'} ago`;
            const days = Math.round(hours / 24);
            return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        function showSharing(sharing) {
            const state = document.getElementById('sharing-state');
            const detail = document.getElementById('sharing-detail');
            const copy = {
                off: ['Off',
                    'Guardian runs every check inside your Home Assistant. Nothing is sent anywhere.'],
                needs_connection: ['On, but not connected yet',
                    'Sharing is switched on, but this Guardian is not connected to a website account, so nothing is being sent.'],
                active: ['On',
                    'Check results and device types are sent to your Prophet Data account.']
            };
            const [title, text] = copy[sharing && sharing.state] || ['Unknown', ''];
            state.textContent = title;
            detail.textContent = text;
        }

        function showLastChecked(report, history) {
            const el = document.getElementById('last-checked');
            if (!report) { el.textContent = ''; return; }
            let text = `Last checked ${timeAgo(report.checked_at)}`;
            if (!report.all_checks_completed) {
                text += history.last_complete_at
                    ? ` · last time every check finished: ${timeAgo(history.last_complete_at)}`
                    : ' · no check has finished completely yet';
            }
            el.textContent = text;
        }

        function showProblem(message) {
            const summary = document.getElementById('summary');
            summary.className = 'error';
            summary.innerHTML = '⚠️ Guardian couldn\'t run its checks' +
                `<div class="summary-sub">${esc(message)} This is not a sign that your home is healthy.</div>`;
            document.getElementById('issues-list').innerHTML = '';
            document.getElementById('incomplete-note').innerHTML = '';
        }

        async function loadIssues() {
            let data;
            try {
                const res = await fetch(BASE_PATH + '/issues');
                if (!res.ok) throw new Error(`Guardian returned status ${res.status}.`);
                data = await res.json();
                if (!data.report) throw new Error('Guardian sent an unexpected response.');
            } catch (e) {
                showProblem(e.message || 'Guardian could not be reached.');
                return;
            }

            const report = data.report;
            const failedIds = new Set(report.failed_checks.map(f => f.id));
            const findings = data.issues.filter(i => !failedIds.has(i.id) && !dismissed.has(i.id));

            const summary = document.getElementById('summary');
            const list = document.getElementById('issues-list');
            const note = document.getElementById('incomplete-note');

            showLastChecked(report, data.history);
            showSharing(data.sharing);

            // Say "healthy" only if every check finished and none found anything.
            const hiddenFindings = report.finding_count - findings.length;
            if (findings.length > 0) {
                summary.className = 'attention';
                summary.textContent = `⚠️ ${findings.length} issue${findings.length > 1 ? 's' : ''} detected`;
            } else if (!report.all_checks_completed) {
                summary.className = 'incomplete';
                summary.innerHTML = '⚠️ Some checks couldn\'t finish' +
                    '<div class="summary-sub">Guardian didn\'t find a problem, but it couldn\'t complete every check, so it can\'t say your system is healthy.</div>';
            } else if (hiddenFindings > 0) {
                summary.className = 'attention';
                summary.textContent = `✅ No open issues (you dismissed ${hiddenFindings} until reload)`;
            } else {
                summary.className = '';
                summary.textContent = '✅ All checks finished — no issues detected';
            }

            if (report.failed_checks.length > 0) {
                note.innerHTML = `<div class="incomplete-note"><strong>${report.failed_checks.length} check${report.failed_checks.length > 1 ? 's' : ''} couldn't finish</strong>` +
                    '<ul>' + report.failed_checks.map(f =>
                        `<li>${esc(f.title)}${f.detail ? ' — ' + esc(f.detail) : ''}</li>`).join('') + '</ul></div>';
            } else {
                note.innerHTML = '';
            }

            list.innerHTML = '';

            if (findings.length === 0) {
                if (report.all_checks_completed && hiddenFindings === 0) {
                    list.innerHTML = '<div id="no-issues">Your system looks healthy.</div>';
                }
                return;
            }

            findings.forEach(issue => {
                const div = document.createElement('div');
                div.className = `issue ${esc(issue.severity)}`;
                div.innerHTML = `
                    <div class="issue-header">
                        <div>
                            <div class="issue-title">${esc(issue.title)}</div>
                            <div class="issue-detail">${esc(issue.detail || '')}</div>
                            <div class="issue-severity">${esc(issue.severity)}</div>
                        </div>
                        <div class="issue-actions">
                            ${issue.suggestion ? `<button class="fix-btn" onclick="toggleFix('${issue.id}')">How to fix</button>` : ''}
                            ${issue.fixable ? `<button class="fix-btn" onclick="applyFix('${issue.automation_id}', '${issue.id}')">Apply Fix</button>` : ''}
                            <button class="dismiss-btn" onclick="dismiss('${issue.id}')">Dismiss</button>
                        </div>
                    </div>
                    ${issue.suggestion ? `
                    <div class="fix-section" id="fix-${issue.id}">
                        <div class="fix-label">💡 Suggested fix</div>
                        <div>${esc(issue.suggestion)}</div>
                    </div>` : ''}
                `;
                list.appendChild(div);
            });
        }

        async function checkNow() {
            const button = document.getElementById('check-now');
            button.disabled = true;
            button.textContent = 'Checking…';
            try {
                await loadIssues();
            } finally {
                button.disabled = false;
                button.textContent = 'Check now';
            }
        }

        async function loadAutomations() {
            const [candidatesRes, monitoredRes] = await Promise.all([
                fetch(BASE_PATH + '/ha/automations/candidates'),
                fetch(BASE_PATH + '/automations/monitored')
            ]);
            candidates = await candidatesRes.json();
            const monitoredData = await monitoredRes.json();
            monitored = new Set(monitoredData.monitored_automation_ids);

            const list = document.getElementById('automation-list');

            if (candidates.length === 0) {
                list.innerHTML = '<div class="no-candidates">No time-based automations targeting lights or switches found.</div>';
                return;
            }

            list.innerHTML = '';
            candidates.forEach(auto => {
                const div = document.createElement('div');
                div.className = 'automation-item';
                div.innerHTML = `
                    <input type="checkbox" id="auto-${auto.id}" value="${auto.id}"
                        ${monitored.has(auto.id) ? 'checked' : ''}>
                    <div class="automation-info">
                        <div class="automation-name">${auto.alias}</div>
                        <div class="automation-meta">Triggers at ${auto.trigger_time} → ${auto.entity_id}</div>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        async function saveSelections() {
            const selected = candidates
                .filter(a => document.getElementById(`auto-${a.id}`).checked)
                .map(a => a.id);

            await fetch(BASE_PATH + '/automations/monitored', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monitored_automation_ids: selected })
            });

            monitored = new Set(selected);
            const confirmation = document.getElementById('save-confirmation');
            confirmation.style.display = 'block';
            setTimeout(() => confirmation.style.display = 'none', 3000);
        }

        function toggleFix(id) {
            const section = document.getElementById(`fix-${id}`);
            section.classList.toggle('visible');
        }
        
        async function applyFix(automationId, issueId) {
            if (!confirm('This will re-enable the automation. Continue?')) return;
            
            try {
                const res = await fetch(BASE_PATH + `/ha/automations/${automationId}/enable`, {
                    method: 'POST'
                });
                if (res.ok) {
                    dismissed.add(issueId);
                    loadIssues();
                } else {
                    alert('Fix failed. Please try manually.');
                }
            } catch (e) {
                alert('Fix failed. Please try manually.');
            }
        }

        function dismiss(id) {
            dismissed.add(id);
            loadIssues();
        }

        loadScenarios();
        loadIssues();
        loadAutomations();
    </script>
</body>
</html>
